[package]
name = "dfu-codecs"
version = "0.1.0"
edition = "2024"
build = "build/build.rs"

[build-dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"

[features]
json = ["dep:serde_json"]

either = ["dep:either"]

[dependencies]
either = { version = "1.18.0", optional = true }
smallvec = "1.15.2"
thiserror = "2.0.20"
serde_json = { version = "1.0.151", optional = true }

[dev-dependencies]
dfu-codecs = { path = ".", features = ["json", "either"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
serde = { version = "1.0.229", features = ["derive"] }

[[bench]]
name = "book"
harness = false